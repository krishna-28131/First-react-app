<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind CSS Basics Exploration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-white shadow p-4 flex flex-col md:flex-row md:space-x-6">
    <a href="#" class="hover:text-blue-600">Home</a>
    <a href="#" class="hover:text-blue-600">Features</a>
    <a href="#" class="hover:text-blue-600">Contact</a>
  </nav>

  <!-- Hero Section -->
  <section class="p-6 text-center">
    <h2 class="text-xl md:text-3xl lg:text-5xl font-bold bg-gradient-to-r from-blue-500 to-purple-600 text-transparent bg-clip-text mb-4">
      Tailwind CSS Exploration
    </h2>
    <div class="max-w-md mx-auto overflow-hidden rounded-lg shadow-lg transform transition hover:scale-105">
      <img src="https://via.placeholder.com/600x300" alt="Hero Image" />
    </div>
  </section>

  <!-- Button -->
  <div class="text-center my-6">
    <button class="px-6 py-2 rounded bg-gray-200 hover:bg-gray-300 active:bg-gray-400 transition">
      Click Me
    </button>
  </div>

  <!-- List Styling -->
  <ul class="list-disc list-inside pl-5 max-w-md mx-auto mb-6">
    <li class="hover:text-blue-600">Tailwind Utilities</li>
    <li class="hover:text-blue-600">Responsive Design</li>
    <li class="hover:text-blue-600">Modern UI</li>
  </ul>

  <!-- Features Grid -->
  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-6">
    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-bold mb-2">Feature One</h3>
      <p class="mb-3">Utility-first styling.</p>
      <button class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 active:bg-gray-400">Learn More</button>
    </div>
    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-bold mb-2">Feature Two</h3>
      <p class="mb-3">Responsive layouts.</p>
      <button class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 active:bg-gray-400">Learn More</button>
    </div>
    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-bold mb-2">Feature Three</h3>
      <p class="mb-3">Clean components.</p>
      <button class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 active:bg-gray-400">Learn More</button>
    </div>
  </section>

  <!-- Table Section -->
  <section class="p-6 overflow-x-auto">
    <table class="w-full border border-gray-300">
      <thead class="bg-gray-200">
        <tr>
          <th class="border p-2">Name</th>
          <th class="border p-2">Role</th>
          <th class="border p-2">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr class="bg-white hover:bg-gray-100">
          <td class="border p-2">Alice</td>
          <td class="border p-2">Developer</td>
          <td class="border p-2">Active</td>
        </tr>
        <tr class="bg-gray-50 hover:bg-gray-100">
          <td class="border p-2">Bob</td>
          <td class="border p-2">Designer</td>
          <td class="border p-2">Active</td>
        </tr>
        <tr class="bg-white hover:bg-gray-100">
          <td class="border p-2">Charlie</td>
          <td class="border p-2">Manager</td>
          <td class="border p-2">Inactive</td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- Contact Form -->
  <section class="p-6 max-w-md mx-auto">
    <form class="bg-white p-4 rounded shadow space-y-4">
      <input type="text" placeholder="Name" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <input type="email" placeholder="Email" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <input type="password" placeholder="Password" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <button class="w-full bg-gray-200 rounded py-2 hover:bg-gray-300 active:bg-gray-400">Submit</button>
    </form>
  </section>

</body>
</html>
